services:
  db:
    image: postgres:16-alpine
    container_name: lawtrack-local-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: lawtrack
    ports:
      - "55432:5432"
    volumes:
      - lawtrack_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  lawtrack_local_db:
